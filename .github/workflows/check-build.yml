name: Check index.html is built from src
on:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'tools/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build.mjs --check
