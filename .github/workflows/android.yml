name: Android app

on:
  push:
    branches: [main]
    paths: ['index.html', 'kdn-live.js', 'assets/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ubuntu runners already include the Android SDK (ANDROID_HOME); just report it.
      - id: sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" || true; node -v; java -version 2>&1 | head -1

      - name: Build app
        id: build
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KDN_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          bash app/build.sh 2>&1 | tee build.log

      # The build log goes to the ci-logs branch so it can be read without opening Actions.
      - name: Save build log
        if: always()
        run: |
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/android-build.log 2>/dev/null || echo "no log" > /tmp/logs/android-build.log
          echo "run ${{ github.run_number }} | build=$STATUS node=${{ steps.node.outcome }} java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} | ${{ github.sha }} | $(date -u +%FT%TZ)" > /tmp/logs/STATUS.txt
          cd /tmp/logs
          git init -q && git checkout -q -b ci-logs
          git config user.name "kdn-ci" && git config user.email "ci@kdnfitness.com"
          git add -A && git commit -q -m "Android build ${{ github.run_number }}: $STATUS"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish download (GitHub Release)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: KDN Fitness app 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Phone test:** download the `-test.apk` file on your Android phone and open it.
            **Google Play:** upload the `.aab` file (appears once the signing key is added).
          files: app/out/*
